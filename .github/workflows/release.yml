name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to release
        required: true
        type: choice
        options:
          - main
          - alpha
          - beta
          - rc

  push:
    branches:
      - main
      - alpha
      - beta
      - rc

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check code
        run: vp check

      - name: Install Playwright Browsers
        run: vp exec playwright install

      - name: Run tests
        run: vp test

      - name: Build package
        run: vp run pack

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    if: |
      inputs.target_branch == 'main' || github.ref_name == 'main' ||
      inputs.target_branch == 'alpha' || github.ref_name == 'alpha' ||
      inputs.target_branch == 'beta' || github.ref_name == 'beta' ||
      inputs.target_branch == 'rc' || github.ref_name == 'rc'

    env:
      VP_GIT_HOOKS: '0'

    steps:
      - name: Validate GitHub App private key
        id: app-key
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const { createPrivateKey, randomUUID } = require('node:crypto')
          const { appendFileSync } = require('node:fs')
          try {
            let pem = process.env.BOT_PRIVATE_KEY.trim().replace(/\\n/g, '\n')
            if (!pem.startsWith('-----BEGIN ')) {
              pem = Buffer.from(pem, 'base64').toString('utf8').trim().replace(/\\n/g, '\n')
            }
            const key = createPrivateKey(pem)
            if (key.asymmetricKeyType !== 'rsa') throw new Error('Expected RSA key')
            const privateKey = key.export({ type: 'pkcs8', format: 'pem' })
            for (const line of privateKey.trim().split('\n')) console.log(`::add-mask::${line}`)
            const delimiter = randomUUID()
            appendFileSync(process.env.GITHUB_OUTPUT, `private-key<<${delimiter}\n${privateKey}${delimiter}\n`)
          } catch {
            console.error('::error::BOT_PRIVATE_KEY must contain a complete, unencrypted RSA private key in PEM or base64-encoded PEM format. Replace the secret with a valid GitHub App private key.')
            process.exitCode = 1
          }
          NODE

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ steps.app-key.outputs.private-key }}
          owner: PHNTMbandit
          repositories: ixia-ui-react
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch || github.ref_name }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build package
        run: vp run pack

      - name: Generate release notes and publish
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  chromatic:
    name: Run Chromatic
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch || github.ref_name }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Run Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
