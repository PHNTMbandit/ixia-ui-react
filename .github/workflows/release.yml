name: Publish to NPM

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - alpha
      - beta
      - rc

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check code
        run: vp check

      - name: Install Playwright Browsers
        run: vp exec playwright install

      - name: Run tests
        run: vp test

      - name: Build package
        run: vp run pack

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    env:
      VP_GIT_HOOKS: '0'

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ixia-ui-react
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          run-install: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build package
        run: vp run pack

      - name: Generate release notes and publish
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  chromatic:
    name: Run Chromatic
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true

      - name: Run Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
